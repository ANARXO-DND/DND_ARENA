 ${S.order.map(i=>{const p=S.players[i];return`<div class="box ${i===S.order[S.turn]?'cur':''}" style="padding:6px;margin-bottom:6px;opacity:${p.dead?.4:1}"><div class="row"><b style="color:${p.color}">● ${p.name}${i===me?' (вы)':''}</b><span class="m">ини ${p.init} · КД ${p.ac}</span></div><div class="hp"><i style="width:${100*p.hp/p.maxhp}%"></i></div><span class="m">${p.hp}/${p.maxhp}${p.dodge?' · уклонение':''}${p.prone?' · ничком':''}${p.incap?' · недееспособен':''}${p.thp?' · врем.хп '+p.thp:''}${p.slow?' · замедлен':''}${p.noheal?' · не лечится':''}${p.oil>0?' · в масле ('+p.oil+')':''}${p.shielded?' · Щит':''}${p.sof?' · Щит веры':''}${p.gb?' · под Направляющим снарядом':''}${p.conc?' · концентрация':''}${p.down?` · ✖ ${p.stable?'стабилен':'жизнь '+p.dsL+'/3, смерть '+p.dsD+'/3'}`:''}</span></div>`}).join('')}
 <div class="m">Перемещение: <b>${mp.mv}</b> · действие ${mp.act?'✔':'✘'} · бонус ${mp.bonus?'✔':'✘'} · реакция ${mp.react?'✔':'✘'} · ${mp.cls==='wizard'?'ячейки '+mp.slots+'/2':'Second Wind '+mp.sw+'/2'} · заряды комплекта ${mp.kit}</div>
 <div>Клик по пустой клетке — идти. Клик по врагу — атака:</div>
 <div><button class="${mode==='main'?'cur':''}" onclick="mode='main';drawBattle()">Основная</button><button class="${mode==='off'?'cur':''}" onclick="mode='off';drawBattle()">Бонусная (2-е оружие)</button></div>
 <div>${a('dash','Рывок',!mp.act)}${a('disengage','Отход',!mp.act)}${a('dodge','Уклонение',!mp.act)}${mp.cls==='fighter'?a('secondwind','Second Wind',!mp.bonus||mp.sw<1):''}${medBtns(mine,mp)}${throwBtns(mine,mp)}${a('end','Конец хода')}</div>
 ${spellPanel(mine,mp)}<div class="box" style="margin-top:8px"><h2>Экипировка</h2><div class="row">Правая ${eqs('main',w=>w.k==='w'||w.k==='k')}</div><div class="row">Левая ${twoMain?'<span class="m">занята</span>':eqs('off',w=>w.k==='s'||w.k==='k'||(w.k==='w'&&w.f.light))}</div><div class="m">Оружие — бесплатно, щит — действие.</div></div>
 <div class="err">${msg}</div><div id="log">${S.log.map(l=>`<div>${l}</div>`).join('')}</div>`;
 $('log').scrollTop=1e5;if(first){const sc=$('sc');sc.scrollLeft=mp.x*CELL-sc.clientWidth/2;sc.scrollTop=mp.y*CELL-sc.clientHeight/2}}
function throwBtns(mine,mp){return Object.entries(mp.inv||{}).filter(([k,n])=>n>0&&I.ITEMS[k].k==='t').map(([k,n])=>`<button class="${mode==='t_'+k?'cur':''}" ${mine&&mp.act?'':'disabled'} onclick="mode='t_${k}';drawBattle()">Бросить: ${I.ITEMS[k].n} (${n})</button>`).join('')+(mode.startsWith('t_')?'<div class="m">Кликните по цели (4 кл.)</div>':'')}
function medBtns(mine,mp){const b=(m,l)=>`<button class="${mode===m?'cur':''}" ${mine?'':'disabled'} onclick="mode='${m}';drawBattle()">${l}</button>`;return(mp.feat==='medic'?b('medic','Лечить'):'')+b('stab','Стабилизировать')+(mp.prone?`<button ${mine?'':'disabled'} onclick="send({t:'standup'})">Встать</button>`:'')}
function pendHtml(){if(!S.pend)return'';const m=S.players[S.pend.mover],sh=S.pend.kind==='shield';
 if(S.pend.reactor!==me)return`<div class="m">⏳ ${S.players[S.pend.reactor].name} решает${sh?', применить ли Щит':', атаковать ли '+m.name}…</div>`;
 return`<div style="position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9"><div class="box" style="text-align:center;font-size:16px"><h2>${sh?'Применить Щит?':'Совершить провоцированную атаку?'}</h2>${sh?m.name+' атакует вас. Щит: +5 КД до начала вашего хода, тратит реакцию и ячейку':m.name+' покидает вашу зону контроля'}<br><br><button style="font-size:28px;color:#3c9" onclick="send({t:'oa',yes:true})">✓</button> <button style="font-size:28px;color:#f55" onclick="send({t:'oa',yes:false})">✕</button></div></div>`}
function eq(){msg='';send({t:'equip',main:$('e_main')?.value||'',off:$('e_off')?.value||''})}
cv.onclick=e=>{if(!S||S.phase!=='battle')return;msg='';const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/CELL),y=Math.floor((e.clientY-r.top)/CELL);
 const t=S.players.find(p=>p&&!p.dead&&p.x===x&&p.y===y);
 if(mode==='disguise')return;
 if(t){if(mode==='magicmissile'){if(t.id!==me){mmT.push(t.id);if(mmT.length===3){send({t:'cast',spell:'magicmissile',targets:mmT});mmT=[];mode='main'}drawBattle()}}
  else if(mode.startsWith('t_')){send({t:'throw',item:mode.slice(2),target:t.id});mode='main'}
  else if(AOE.includes(mode)){const q=S.players[me];if(t.id!==me&&Math.max(Math.abs(t.x-q.x),Math.abs(t.y-q.y))<=1){sbT=sbT.includes(t.id)?sbT.filter(i=>i!==t.id):[...sbT,t.id];drawBattle()}}
  else if(mode==='tasha'||mode==='curewounds'||mode==='witchbolt'||SP1.includes(mode)||CT1.includes(mode)){send({t:'cast',spell:mode,target:t.id});mode='main'}
  else if(mode==='acidsplash'){if(t.id!==me&&!acT.includes(t.id)){acT.push(t.id);if(acT.length===2){send({t:'cast',spell:'acidsplash',targets:acT});acT=[];mode='main'}drawBattle()}}
  else if(mode==='medic')send({t:'medic',target:t.id});else if(mode==='stab')send({t:'stabilize',target:t.id});
  else if(t.id!==me)send({t:'attack',target:t.id,which:mode})}else send({t:'move',x,y})};
ws.addEventListener('message',e=>{if(JSON.parse(e.data).t==='err'&&S&&S.phase!=='lobby')drawBattle()});
</script></body></html>
