<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&D Арена</title><style>
:root{--bg:#14161c;--p:#1e222b;--t:#e8e8ee;--m:#8b90a0;--a:#d4a73a;--b:#2e3442}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
h2{margin:0 0 8px;font-size:15px;color:var(--a)}.box{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:12px;margin-bottom:12px}
button,select,input{background:#2a3040;color:var(--t);border:1px solid var(--b);border-radius:5px;padding:5px 9px;font:inherit}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--a)}button:disabled{opacity:.35;cursor:not-allowed}
#c{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding:12px 12px 90px;max-width:1200px;margin:auto}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:3px 0}.m{color:var(--m);font-size:12px}
#ready{position:fixed;right:18px;bottom:18px;width:64px;height:64px;border-radius:50%;font-size:30px;background:#2e7d4f;border:0}
#bt{display:grid;grid-template-columns:1fr 320px;height:100vh}#sc{overflow:auto}#side{padding:10px;overflow:auto;background:var(--p)}
#log{font-size:12px;height:200px;overflow:auto;background:#101319;padding:6px;border-radius:5px}
.hp{height:6px;background:#400;border-radius:3px}.hp i{display:block;height:100%;background:#3c9;border-radius:3px}
#side button{margin:2px}.cur{border-color:var(--a)!important}.err{color:#f66}
</style></head><body><div id="c"></div><div id="bt" hidden><div id="sc" style="position:relative"><canvas id="cv"></canvas><canvas id="fx" style="position:absolute;left:0;top:0;pointer-events:none"></canvas></div><div id="side"></div></div>
<button id="ready" title="Готов">✓</button><script>
const ST=['Сила','Ловкость','Телосложение','Интеллект','Мудрость','Харизма'],mod=s=>Math.floor((s-10)/2),sg=n=>(n>=0?'+':'')+n;
const STY={def:['Оборона','+1 КД в доспехе'],duel:['Дуэлянт','+2 урона: одноручное оружие, вторая рука без оружия'],gwf:['Большое оружие','Перебрасывать 1 и 2 на кости урона (двуручный хват)'],twf:['Два оружия','Мод. характеристики к урону доп. атаки']};
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);let me=-1,I,S=null,msg='',cs={cls:'fighter',spells:[],cantrips:[],race:'human',name:'',base:[8,8,8,8,8,8],style:'duel',feat:'tough',inv:{},eq:{main:'',off:'',armor:''}},mode='main',sent=false;
const $=id=>document.getElementById(id),send=o=>ws.send(JSON.stringify(o));
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='init'){I=m;me=m.id;cs.base=[...m.RACES.human.start];cs.name='Игрок'+(me+1);}else if(m.t==='reset'){sent=false;msg='';mode='main'}else if(m.t==='fx'){fx(m)}
 else if(m.t==='err'){msg=m.m;draw()}else if(m.t==='state'){const first=!S||S.phase!=='battle';S=m;if(m.phase!=='lobby'){msg=msg;drawBattle(first)}else draw()}};
const used=()=>6,left=()=>27-cs.base.reduce((s,x,i)=>s+I.COST[x]-I.COST[I.RACES[cs.race].start[i]],0),coins=()=>150-Object.entries(cs.inv).reduce((s,[k,n])=>s+I.ITEMS[k].c*n,0),fin=i=>cs.base[i]+(I.FEATS[cs.feat].ab===i?1:0);
function ac(){const M=cs.base.map((_,i)=>mod(fin(i))),a=I.ITEMS[cs.eq.armor];let v=10+M[1];if(a){v=a.base+(a.dex==='full'?M[1]:Math.min(M[1],a.dex));if(cs.style==='def')v++}if(cs.eq.off==='shield')v+=2;return v}
function fixEq(){for(const k of['main','off','armor']){const id=cs.eq[k];if(id&&!((cs.inv[id]||0)>=(['main','off','armor'].filter(j=>cs.eq[j]===id).length)))cs.eq[k]=''}
 const m=I.ITEMS[cs.eq.main];if(m&&m.f?.two)cs.eq.off='';const a=I.ITEMS[cs.eq.armor];if(a&&a.str&&fin(0)<a.str)cs.eq.armor='';if(cs.cls==='wizard'){cs.eq.armor='';if(cs.eq.off==='shield')cs.eq.off=''}}
let mmT=[],acT=[],sbT=[];const SELF=['falselife','thunderwave'],CT1=['firebolt','rayoffrost','shockinggrasp','chilltouch'],TOKS=['human','dwarf','halfling','w_human','w_dwarf','w_halfling'],TL={human:'Человек-воин',dwarf:'Дворф-воин',halfling:'Полурослик-воин',w_human:'Человек-маг',w_dwarf:'Дворф-маг',w_halfling:'Полурослик-маг'};
function setCls(k){cs.cls=k;cs.spells=[];cs.cantrips=[];if(k==='wizard')for(const id in cs.inv)if(['a','s'].includes(I.ITEMS[id].k))delete cs.inv[id];fixEq();draw()}
const maxSp=()=>Math.max(1,1+mod(fin(3)));
function prep(k){if(cs.spells.length<maxSp())cs.spells.push(k);draw()}
function unprep(k){cs.spells=cs.spells.filter(x=>x!==k);draw()}
const maxCt=()=>3; // ур. 1-3: 3 заговора (с 4 ур. будет 4)
function ctAdd(k){if(cs.cantrips.length<maxCt())cs.cantrips.push(k);draw()}
function ctDel(k){cs.cantrips=cs.cantrips.filter(x=>x!==k);draw()}
function pickBox(t,all,pr,mx,add,del){const av=Object.keys(all).filter(k=>!pr.includes(k)),
 card=(k,f)=>`<div class="row" style="cursor:pointer;justify-content:flex-start;gap:8px;align-items:flex-start" onclick="${f}('${k}')"><img src="${SPIMG[k]}" width=48 height=48 style="border-radius:6px;flex:none"><span><b>${all[k].n}</b><div class="m">${all[k].desc}</div></span></div>`;
 return`<div class="box"><h2>${t} · выбрано ${pr.length}/${mx}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><div class="m">Выбранные (клик — убрать)</div>${pr.map(k=>card(k,del)).join('')||'<div class="m">— выберите справа —</div>'}</div><div><div class="m">Доступные (клик — выбрать)</div>${av.map(k=>card(k,add)).join('')}</div></div></div>`}
function spellsUI(){const mx=maxSp();if(cs.spells.length>mx)cs.spells.length=mx;
 return pickBox('Заговоры (0 круг, без ячеек)',I.CANTRIPS,cs.cantrips,maxCt(),'ctAdd','ctDel')+pickBox('Заклинания 1 круга · 2 ячейки',I.SPELLS,cs.spells,mx,'prep','unprep')}
function sbAll(){const q=S.players[me];sbT=S.players.filter(o=>o&&!o.dead&&o.id!==me&&Math.max(Math.abs(o.x-q.x),Math.abs(o.y-q.y))<=1).map(o=>o.id);drawBattle()}
function castSel(k){mmT=[];acT=[];sbT=[];msg='';if(SELF.includes(k)){send({t:'cast',spell:k});mode='main'}else mode=k;drawBattle()}
function spellPanel(mine,mp){if(mp.cls!=='wizard')return'';
 const btn=(k,sp,dis,tag)=>`<button style="display:flex;gap:6px;align-items:center;text-align:left;width:100%;margin:2px 0" class="${mode===k?'cur':''}" ${dis?'disabled':''} onclick="castSel('${k}')"><img src="${SPIMG[k]}" width=36 height=36 style="border-radius:5px"><span><b>${sp.n}</b>${tag}</span></button>`;
 const Ht={magicmissile:`Стрелы: ${mmT.length}/3 — кликайте по целям`,acidsplash:`Цели: ${acT.length}/2 — клик по существам (вторая рядом с первой) <button onclick="if(acT.length){send({t:'cast',spell:'acidsplash',targets:acT});acT=[];mode='main'}">Бросить</button>`,
  swordburst:`Цели: ${sbT.length} — клик по существам рядом <button onclick="sbAll()">Все вокруг</button> <button onclick="if(sbT.length){send({t:'cast',spell:'swordburst',targets:sbT});sbT=[];mode='main'}">Применить</button>`,
  disguise:'Выберите облик: '+TOKS.map(t=>`<button title="${TL[t]}" onclick="send({t:'cast',spell:'disguise',tok:'${t}'});mode='main'"><img src="${TK[t]}" width=40 height=40></button>`).join('')+` <button onclick="send({t:'cast',spell:'disguise',tok:'orig'});mode='main'">Свой облик</button>`};
 const hint=Ht[mode]||(CT1.includes(mode)?`Кликните по цели (${I.CANTRIPS[mode].rng} кл.)`:'');
 return`<div class="box" style="margin-top:8px"><h2>Заговоры · бесконечно</h2>${(mp.cant||[]).map(k=>btn(k,I.CANTRIPS[k],!mine||!mp.act,'')).join('')}<h2>Заклинания · ячейки ${mp.slots}/2</h2>${(mp.prep||[]).map(k=>{const sp=I.SPELLS[k];return btn(k,sp,!mine||sp.react||mp.slots<1||!mp.act,sp.react?' <i class="m">(реакция, спросит сама)</i>':'')}).join('')}${hint?`<div class="m">${hint}</div>`:''}</div>`}
function setRace(k){cs.race=k;cs.base=[...I.RACES[k].start];fixEq();draw()}
function stat(i,d){const v=cs.base[i]+d;if(v<I.RACES[cs.race].start[i]||v>15)return;cs.base[i]=v;if(left()<0)cs.base[i]-=d;fixEq();draw()}
function buy(k,d){const n=(cs.inv[k]||0)+d;if(n<0||(d>0&&coins()<I.ITEMS[k].c))return;cs.inv[k]=n;fixEq();draw()}
const opt=(v,t,s)=>`<option value="${v}" ${s?'selected':''}>${t}</option>`;
function wdesc(w){if(w.k==='t')return w.desc;if(w.k==='k')return'10 зарядов · держать в руке, брать и убирать бесплатно';return w.k==='w'?`${w.d[0]}d${w.d[1]} ${w.dt}${w.v?` (2 руки: 1d${w.v[1]})`:''} · ${[w.f.light&&'лёгкое',w.f.finesse&&'фехт.',w.f.thrown&&'метат.',w.f.two&&'двуруч.',w.f.reach&&'досяг. 10фт',w.f.rng&&`дальнобойное, ${w.f.rng} кл. без помехи`,w.f.heavy&&'тяжёлое'].filter(Boolean).join(', ')}`:w.k==='a'?`КД ${w.base}${w.dex==='full'?' + Лов':w.dex?` + Лов (макс +${w.dex})`:''}${w.str?` · Сила ${w.str}`:''}${w.metal?' · металл':''}`:`+${w.ac} КД`}
function draw(){if(!I||(S&&S.phase!=='lobby'))return;$('bt').hidden=true;$('c').hidden=false;
 const n=S?S.players.filter(p=>p&&p.ready).length:0;$('ready').style.display=sent?'none':'block';
 if(sent){$('c').innerHTML=`<div class="box"><h2>Готово!</h2>Ожидание игроков: ${n}/4 готовы</div>`;return}
 const M=cs.base.map((_,i)=>mod(fin(i))),maxhp=(cs.cls==='wizard'?6:10)+M[2]+((I.RACES[cs.race].hpPerLevel||0)+(I.FEATS[cs.feat].hpPerLevel||0));
 const items=Object.entries(I.ITEMS).map(([k,w])=>{const bad=(w.str&&fin(0)<w.str)||(cs.cls==='wizard'&&(w.k==='a'||w.k==='s'));return`<div class="row"><div><b>${w.n}</b> <span class="m">${w.c}м</span><div class="m">${wdesc(w)}</div></div><div><button ${(cs.inv[k]||0)?'':'disabled'} onclick="buy('${k}',-1)">−</button> ${cs.inv[k]||0} <button ${bad||coins()<w.c?'disabled':''} onclick="buy('${k}',1)">+</button></div></div>`}).join('');
 const own=(f)=>Object.keys(cs.inv).filter(k=>cs.inv[k]&&f(I.ITEMS[k]));
 const sel=(slot,list,extra)=>`<select onchange="cs.eq.${slot}=this.value;fixEq();draw()">${opt('','— пусто —',!cs.eq[slot])}${list.map(k=>opt(k,I.ITEMS[k].n,cs.eq[slot]===k)).join('')}</select>`;
 $('c').innerHTML=`<div><div class="box"><h2>Персонаж — 1 ур.</h2><select onchange="setCls(this.value)">${Object.entries(I.CLASSES).map(([k,c])=>opt(k,c.name,cs.cls===k)).join('')}</select> <select onchange="setRace(this.value)">${Object.entries(I.RACES).map(([k,r])=>opt(k,r.n,cs.race===k)).join('')}</select> <div class="m">${I.RACES[cs.race].desc}</div><input value="${cs.name}" maxlength=16 onchange="cs.name=this.value" style="width:100%;margin-bottom:8px">
 <div class="m">Очки: <b style="color:var(--a)">${left()}</b>/27 (максимум 15 с учётом расы). ${cs.cls==='wizard'?'Кость хитов d6, мастерство +2, спасброски: Интеллект, Мудрость. Без брони и щитов, владеет только простым оружием (кинжал); воинское оружие в руках запрещает колдовать':'Кость хитов d10, мастерство +2, спасброски: Сила, Телосложение'}</div>
 ${ST.map((s,i)=>`<div class="row"><span>${s}</span><span><button onclick="stat(${i},-1)">−</button> <b>${fin(i)}</b> <span class="m">(${sg(M[i])})</span> <button onclick="stat(${i},1)">+</button></span></div>`).join('')}
 <hr style="border-color:var(--b)">Хиты: <b>${maxhp}</b> · КД: <b>${ac()}</b> · Скорость: 6 клеток</div>
 ${cs.cls==='fighter'?`<div class="box"><h2>Боевой стиль</h2>${Object.entries(STY).map(([k,[n,d]])=>`<label class="row" style="justify-content:flex-start"><input type="radio" name="s" ${cs.style===k?'checked':''} onchange="cs.style='${k}';draw()"><span><b>${n}</b><div class="m">${d}</div></span></label>`).join('')}</div>`:spellsUI()}
 <div class="box"><h2>Черта (одна)</h2>${Object.entries(I.FEATS).map(([k,f])=>`<label class="row" style="justify-content:flex-start"><input type="radio" name="f" ${cs.feat===k?'checked':''} onchange="cs.feat='${k}';draw()"><span><b>${f.n}</b><div class="m">${f.desc}</div></span></label>`).join('')}</div></div>
 <div class="box"><h2>Магазин — монет: ${coins()}</h2>${items}</div>
 <div class="box"><h2>Экипировка</h2><div class="row">Правая рука ${sel('main',own(w=>w.k==='w'||w.k==='k'))}</div>
 <div class="row">Левая рука ${cs.eq.main&&I.ITEMS[cs.eq.main].f?.two?'<span class="m">занята двуручным</span>':sel('off',own(w=>w.k==='s'||w.k==='k'||(w.k==='w'&&w.f.light)))}</div>
 <div class="row">Доспех ${sel('armor',own(w=>w.k==='a'&&(!w.str||fin(0)>=w.str)))}</div>
 <div class="m">Два лёгких оружия → бонусная атака. Длинный меч без второй руки — 1d10.</div></div>
 <div class="err">${msg}</div>`}
$('ready').onclick=()=>{msg='';send({t:'ready',c:cs});sent=true;ws.addEventListener('message',function f(e){const m=JSON.parse(e.data);if(m.t==='err'){sent=false;draw();ws.removeEventListener('message',f)}else if(m.t==='state')ws.removeEventListener('message',f)})};

 $('side').innerHTML=`${pendHtml()}<h2>${S.phase==='over'?'Бой окончен — возврат в меню…':mine?'ВАШ ХОД':'Ходит: '+cur.name}</h2>
 ${S.order.map(i=>{const p=S.players[i];return`<div class="box ${i===S.order[S.turn]?'cur':''}" style="padding:6px;margin-bottom:6px;opacity:${p.dead?.4:1}"><div class="row"><b style="color:${p.color}">● ${p.name}${i===me?' (вы)':''}</b><span class="m">ини ${p.init} · КД ${p.ac}</span></div><div class="hp"><i style="width:${100*p.hp/p.maxhp}%"></i></div><span class="m">${p.hp}/${p.maxhp}${p.dodge?' · уклонение':''}${p.prone?' · ничком':''}${p.incap?' · недееспособен':''}${p.thp?' · врем.хп '+p.thp:''}${p.slow?' · замедлен':''}${p.noheal?' · не лечится':''}${p.oil>0?' · в масле ('+p.oil+')':''}${p.shielded?' · Щит':''}${p.conc?' · концентрация':''}${p.down?` · ✖ ${p.stable?'стабилен':'жизнь '+p.dsL+'/3, смерть '+p.dsD+'/3'}`:''}</span></div>`}).join('')}
 <div class="m">Перемещение: <b>${mp.mv}</b> · действие ${mp.act?'✔':'✘'} · бонус ${mp.bonus?'✔':'✘'} · реакция ${mp.react?'✔':'✘'} · ${mp.cls==='wizard'?'ячейки '+mp.slots+'/2':'Second Wind '+mp.sw+'/2'} · заряды комплекта ${mp.kit}</div>
 <div>Клик по пустой клетке — идти. Клик по врагу — атака:</div>
 <div><button class="${mode==='main'?'cur':''}" onclick="mode='main';drawBattle()">Основная</button><button class="${mode==='off'?'cur':''}" onclick="mode='off';drawBattle()">Бонусная (2-е оружие)</button></div>
 <div>${a('dash','Рывок',!mp.act)}${a('disengage','Отход',!mp.act)}${a('dodge','Уклонение',!mp.act)}${mp.cls==='fighter'?a('secondwind','Second Wind',!mp.bonus||mp.sw<1):''}${medBtns(mine,mp)}${throwBtns(mine,mp)}${a('end','Конец хода')}</div>
 ${spellPanel(mine,mp)}<div class="box" style="margin-top:8px"><h2>Экипировка</h2><div class="row">Правая ${eqs('main',w=>w.k==='w'||w.k==='k')}</div><div class="row">Левая ${twoMain?'<span class="m">занята</span>':eqs('off',w=>w.k==='s'||w.k==='k'||(w.k==='w'&&w.f.light))}</div><div class="m">Оружие — бесплатно, щит — действие.</div></div>
 <div class="err">${msg}</div><div id="log">${S.log.map(l=>`<div>${l}</div>`).join('')}</div>`;
 $('log').scrollTop=1e5;if(first){const sc=$('sc');sc.scrollLeft=mp.x*CELL-sc.clientWidth/2;sc.scrollTop=mp.y*CELL-sc.clientHeight/2}}
function throwBtns(mine,mp){return Object.entries(mp.inv||{}).filter(([k,n])=>n>0&&I.ITEMS[k].k==='t').map(([k,n])=>`<button class="${mode==='t_'+k?'cur':''}" ${mine&&mp.act?'':'disabled'} onclick="mode='t_${k}';drawBattle()">Бросить: ${I.ITEMS[k].n} (${n})</button>`).join('')+(mode.startsWith('t_')?'<div class="m">Кликните по цели (4 кл.)</div>':'')}
function medBtns(mine,mp){const b=(m,l)=>`<button class="${mode===m?'cur':''}" ${mine?'':'disabled'} onclick="mode='${m}';drawBattle()">${l}</button>`;return(mp.feat==='medic'?b('medic','Лечить'):'')+b('stab','Стабилизировать')+(mp.prone?`<button ${mine?'':'disabled'} onclick="send({t:'standup'})">Встать</button>`:'')}
function pendHtml(){if(!S.pend)return'';const m=S.players[S.pend.mover],sh=S.pend.kind==='shield';
 if(S.pend.reactor!==me)return`<div class="m">⏳ ${S.players[S.pend.reactor].name} решает${sh?', применить ли Щит':', атаковать ли '+m.name}…</div>`;
 return`<div style="position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9"><div class="box" style="text-align:center;font-size:16px"><h2>${sh?'Применить Щит?':'Совершить провоцированную атаку?'}</h2>${sh?m.name+' атакует вас. Щит: +5 КД до начала вашего хода, тратит реакцию и ячейку':m.name+' покидает вашу зону контроля'}<br><br><button style="font-size:28px;color:#3c9" onclick="send({t:'oa',yes:true})">✓</button> <button style="font-size:28px;color:#f55" onclick="send({t:'oa',yes:false})">✕</button></div></div>`}
function eq(){msg='';send({t:'equip',main:$('e_main')?.value||'',off:$('e_off')?.value||''})}
cv.onclick=e=>{if(!S||S.phase!=='battle')return;msg='';const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/CELL),y=Math.floor((e.clientY-r.top)/CELL);
 const t=S.players.find(p=>p&&!p.dead&&p.x===x&&p.y===y);
 if(mode==='disguise')return;
 if(t){if(mode==='magicmissile'){if(t.id!==me){mmT.push(t.id);if(mmT.length===3){send({t:'cast',spell:'magicmissile',targets:mmT});mmT=[];mode='main'}drawBattle()}}
  else if(mode.startsWith('t_')){send({t:'throw',item:mode.slice(2),target:t.id});mode='main'}
  else if(mode==='swordburst'){const q=S.players[me];if(t.id!==me&&Math.max(Math.abs(t.x-q.x),Math.abs(t.y-q.y))<=1){sbT=sbT.includes(t.id)?sbT.filter(i=>i!==t.id):[...sbT,t.id];drawBattle()}}
  else if(mode==='tasha'||mode==='curewounds'||CT1.includes(mode)){send({t:'cast',spell:mode,target:t.id});mode='main'}
  else if(mode==='acidsplash'){if(t.id!==me&&!acT.includes(t.id)){acT.push(t.id);if(acT.length===2){send({t:'cast',spell:'acidsplash',targets:acT});acT=[];mode='main'}drawBattle()}}
  else if(mode==='medic')send({t:'medic',target:t.id});else if(mode==='stab')send({t:'stabilize',target:t.id});
  else if(t.id!==me)send({t:'attack',target:t.id,which:mode})}else send({t:'move',x,y})};
const _e=ws.onmessage;ws.addEventListener('message',e=>{if(JSON.parse(e.data).t==='err'&&S&&S.phase!=='lobby')drawBattle()});
</script></body></html>
